    <ellipse cx="822" cy="1425" rx="18" ry="10"/><ellipse cx="1005" cy="1492" rx="14" ry="8"/>
    <ellipse cx="1242" cy="1522" rx="17" ry="9"/><ellipse cx="1420" cy="1568" rx="15" ry="8"/>
  </g>

  <!-- subtle field / cultivation traces on southern-right fringe -->
  <g fill="none" stroke="#9b8f69" stroke-width="7" opacity=".24" stroke-linecap="round">
    <path d="M1080 1650 C1180 1618 1290 1628 1395 1658"/>
    <path d="M1080 1682 C1185 1650 1295 1660 1400 1690"/>
    <path d="M1095 1715 C1190 1688 1295 1696 1388 1725"/>
  </g>

  <!-- dry worn-earth traces linking household areas into the ground -->
  <g fill="#b6a486" opacity=".18">
    <ellipse cx="475" cy="590" rx="230" ry="105"/>
    <ellipse cx="1060" cy="845" rx="245" ry="115"/>
    <ellipse cx="480" cy="1150" rx="245" ry="120"/>
    <ellipse cx="350" cy="1565" rx="190" ry="86"/>
    <ellipse cx="1270" cy="1505" rx="210" ry="88"/>
  </g>
</svg>