  <path d="M500 1270 C610 1300 650 1350 745 1388 C865 1438 930 1450 1035 1485 C1180 1532 1308 1555 1605 1570"
        fill="none" stroke="url(#waterSpeck)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>

  <!-- irregular bank islands / grasses -->
  <g fill="#73805c" opacity=".62">
    <ellipse cx="610" cy="1310" rx="36" ry="12"/><ellipse cx="690" cy="1362" rx="28" ry="10"/>
    <ellipse cx="905" cy="1460" rx="40" ry="12"/><ellipse cx="1120" cy="1515" rx="32" ry="10"/>
    <ellipse cx="1310" cy="1542" rx="42" ry="12"/><ellipse cx="1500" cy="1588" rx="36" ry="10"/>
  </g>
  <g fill="#7b7461" opacity=".72">
