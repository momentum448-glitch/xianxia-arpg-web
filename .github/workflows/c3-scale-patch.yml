name: C3 Scale Patch

on:
  push:
    branches:
      - 'c3/expand-world-scale'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: c3/expand-world-scale
          fetch-depth: 0

      - name: Reflow world landmarks
        run: python scripts/reflow_world.py

      - name: Commit patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c3-scale-patch.yml scripts/reflow_world.py
          git add src/scenes/GameScene.ts
          git commit -m "feat(c3): reflow landmarks for expanded world"
          git push origin HEAD:c3/expand-world-scale
