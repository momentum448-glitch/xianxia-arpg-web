name: Preview salvage settlement houses

on:
  push:
    branches:
      - fix/settlement-house-rgba
    paths:
      - '.github/workflows/convert-settlement-house-rgba.yml'

permissions:
  contents: read

jobs:
  salvage-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/settlement-house-rgba

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Salvage into preview folder
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src_dir = Path('public/assets/c4/environment/settlement')
          out_dir = Path('salvage_preview')
          out_dir.mkdir(exist_ok=True)
          names = [
              'env_house_hall_a.png',
              'env_house_thatch_a.png',
              'env_house_thatch_b.png',
              'env_house_tile_a.png',
          ]

          for name in names:
              src_path = src_dir / name
              out_path = out_dir / name
              with Image.open(src_path) as src:
                  rgba = src.convert('RGBA')
                  rgba.save(out_path, format='PNG', optimize=True)
              with Image.open(out_path) as check:
                  alpha = check.getchannel('A')
                  lo, hi = alpha.getextrema()
                  print(f'{name}: size={check.size} mode={check.mode} alpha={lo}-{hi} bbox={alpha.getbbox()}')
          PY

      - name: Upload salvage preview
        uses: actions/upload-artifact@v4
        with:
          name: settlement-house-salvage-preview
          path: salvage_preview/*.png
          if-no-files-found: error
