name: Verify clean settlement house staging

on:
  push:
    branches:
      - fix/settlement-house-rgba
    paths:
      - '.github/workflows/convert-settlement-house-rgba.yml'
      - '.asset_stage_rgba/**'

permissions:
  contents: read

jobs:
  verify-hall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/settlement-house-rgba

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Decode and verify Hall
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io
          from PIL import Image

          stage = Path('.asset_stage_rgba')
          text = (stage / 'env_house_hall_a.part0').read_text().strip() + (stage / 'env_house_hall_a.part1').read_text().strip()
          data = base64.b64decode(text, validate=True)
          expected = 'f047b6d275dbce9c50c6f3a00ae236b9a489f7bd4e2182f0b42cf3f60e45304f'
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, (actual, expected)
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert data[24] == 8 and data[25] == 6, (data[24], data[25])
          with Image.open(io.BytesIO(data)) as im:
              im.load()
              assert im.mode == 'RGBA', im.mode
              assert im.size == (128, 89), im.size
              assert im.getchannel('A').getextrema() == (0, 255), im.getchannel('A').getextrema()
          print('HALL CLEAN RGBA PASS', len(data), actual)
          PY
