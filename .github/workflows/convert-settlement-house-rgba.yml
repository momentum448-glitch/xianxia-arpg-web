name: Convert settlement houses to RGBA

on:
  push:
    branches:
      - fix/settlement-house-rgba
    paths:
      - '.github/workflows/convert-settlement-house-rgba.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/settlement-house-rgba

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Convert and verify RGBA PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              Path('public/assets/c4/environment/settlement/env_house_hall_a.png'),
              Path('public/assets/c4/environment/settlement/env_house_thatch_a.png'),
              Path('public/assets/c4/environment/settlement/env_house_thatch_b.png'),
              Path('public/assets/c4/environment/settlement/env_house_tile_a.png'),
          ]

          for path in files:
              with Image.open(path) as src:
                  size = src.size
                  rgba = src.convert('RGBA')
                  rgba.save(path, format='PNG', optimize=True)

              raw = path.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              assert raw[12:16] == b'IHDR', path
              bit_depth = raw[24]
              color_type = raw[25]
              assert bit_depth == 8, (path, bit_depth)
              assert color_type == 6, (path, color_type)

              with Image.open(path) as check:
                  assert check.mode == 'RGBA', (path, check.mode)
                  assert check.size == size, (path, check.size, size)
                  alpha = check.getchannel('A')
                  lo, hi = alpha.getextrema()
                  assert lo < 255 and hi == 255, (path, lo, hi)
                  print(f'{path}: PASS size={check.size} mode={check.mode} alpha={lo}-{hi} bytes={len(raw)}')
          PY

      - name: Commit converted assets and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/c4/environment/settlement/*.png
          git rm .github/workflows/convert-settlement-house-rgba.yml
          git commit -m 'fix(art): convert settlement houses to RGBA truecolor'
          git push origin HEAD:fix/settlement-house-rgba
