name: Install verified Hall runtime proof

on:
  push:
    branches:
      - fix/settlement-house-rgba
    paths:
      - '.github/workflows/convert-settlement-house-rgba.yml'
      - '.asset_stage_rgba/env_house_hall_a.part0'
      - '.asset_stage_rgba/env_house_hall_a.part1'

permissions:
  contents: write

jobs:
  install-hall-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/settlement-house-rgba
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Decode verify and install Hall
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          from PIL import Image

          stage = Path('.asset_stage_rgba')
          text = (stage / 'env_house_hall_a.part0').read_text().strip() + (stage / 'env_house_hall_a.part1').read_text().strip()
          data = base64.b64decode(text, validate=True)
          expected = 'f047b6d275dbce9c50c6f3a00ae236b9a489f7bd4e2182f0b42cf3f60e45304f'
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, (actual, expected)
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert data[24] == 8 and data[25] == 6, (data[24], data[25])

          target = Path('public/assets/c4/environment/settlement/env_house_hall_a.png')
          target.write_bytes(data)

          with Image.open(target) as im:
              im.load()
              assert im.mode == 'RGBA', im.mode
              assert im.size == (128, 89), im.size
              assert im.getchannel('A').getextrema() == (0, 255), im.getchannel('A').getextrema()

          assert target.stat().st_size == 22633, target.stat().st_size
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
          print('HALL RUNTIME PROOF INSTALLED', target.stat().st_size, actual)
          PY

      - name: Commit verified runtime Hall
        run: |
          if git diff --quiet -- public/assets/c4/environment/settlement/env_house_hall_a.png; then
            echo 'Runtime Hall already matches verified source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/c4/environment/settlement/env_house_hall_a.png
          git commit -m 'fix(art): install verified Hall RGBA runtime proof'
          git push origin HEAD:fix/settlement-house-rgba
