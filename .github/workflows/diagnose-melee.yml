name: Diagnose melee texture
on:
  push:
    branches: [fix/melee-binary-build-id]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository PNG
        run: |
          set -euxo pipefail
          ASSET='public/assets/c4/actors/enemies/melee/en_melee_idle_s.png'
          ls -l "$ASSET"
          file "$ASSET"
          sha256sum "$ASSET"
          python3 - <<'PY'
          import struct, pathlib
          p=pathlib.Path('public/assets/c4/actors/enemies/melee/en_melee_idle_s.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          n=struct.unpack('>I', b[8:12])[0]
          assert b[12:16] == b'IHDR'
          w,h,depth,ctype,comp,filt,interlace=struct.unpack('>IIBBBBB', b[16:29])
          print('PNG', w, h, 'depth', depth, 'color_type', ctype, 'bytes', len(b))
          print('chunks:', end=' ')
          i=8
          chunks=[]
          while i+12 <= len(b):
              ln=struct.unpack('>I', b[i:i+4])[0]
              typ=b[i+4:i+8].decode('ascii','replace')
              chunks.append((typ,ln))
              i += 12+ln
              if typ=='IEND': break
          print(chunks)
          PY
          if command -v identify >/dev/null 2>&1; then identify -verbose "$ASSET" | head -80; fi
      - name: Inspect deployed Pages asset
        run: |
          set -euxo pipefail
          URL='https://momentum448-glitch.github.io/xianxia-arpg-web/assets/c4/actors/enemies/melee/en_melee_idle_s.png'
          curl -L --fail-with-body -sS -D /tmp/headers.txt -o /tmp/melee.png "$URL"
          cat /tmp/headers.txt
          ls -l /tmp/melee.png
          file /tmp/melee.png
          sha256sum /tmp/melee.png
          cmp public/assets/c4/actors/enemies/melee/en_melee_idle_s.png /tmp/melee.png && echo 'LIVE_BYTES_MATCH_REPO=YES'
