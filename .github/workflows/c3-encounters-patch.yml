name: C3 Encounter Patch

on:
  push:
    branches: [c3/biome-encounters]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c3/biome-encounters
          fetch-depth: 0

      - name: Apply biome encounter patch
        run: python scripts/apply-c3-encounters.py

      - name: Commit patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c3-encounters-patch.yml scripts/apply-c3-encounters.py
          git add src/scenes/GameScene.ts
          git commit -m "feat(c3): add biome encounters and world events"
          git push origin HEAD:c3/biome-encounters
