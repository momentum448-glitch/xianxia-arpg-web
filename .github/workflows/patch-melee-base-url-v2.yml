name: Patch melee base URL v2
on:
  push:
    branches: [fix/melee-base-url-fail-loud]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/melee-base-url-fail-loud
      - name: Replace Vite env URL resolution
        shell: python
        run: |
          from pathlib import Path
          for path in [Path('src/scenes/GameScene.ts'), Path('src/game/actorVisuals.ts')]:
              s = path.read_text()
              s = s.replace("`${import.meta.env.BASE_URL}${C4_ASSETS.playerMaleIdleSouth}`", "new URL(C4_ASSETS.playerMaleIdleSouth, document.baseURI).toString()")
              s = s.replace("`${import.meta.env.BASE_URL}${C4_ASSETS.enemyMeleeIdleSouth}`", "new URL(C4_ASSETS.enemyMeleeIdleSouth, document.baseURI).toString()")
              path.write_text(s)
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-melee-base-url-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scenes/GameScene.ts src/game/actorVisuals.ts .github/workflows/patch-melee-base-url-v2.yml
          git commit -m "fix(art): resolve C4 assets from document base URI"
          git push
