name: Fix player hitbox stroke

on:
  push:
    branches:
      - fix/player-hitbox-stroke

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-hitbox-stroke
      - name: Remove visible hitbox stroke
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scenes/GameScene.ts')
          s = p.read_text()
          old = """    if (time < this.invulnerableUntil) {\n      this.player.setStrokeStyle(5, 0xf5e8a8);\n    } else {\n      this.player.setStrokeStyle(3, 0xf6ead0);\n    }\n"""
          new = """    this.player.setStrokeStyle(0, 0x000000, 0);\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/fix-player-hitbox-stroke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/GameScene.ts .github/workflows/fix-player-hitbox-stroke.yml
          git commit -m "fix(c4): hide player gameplay hitbox stroke"
          git push origin HEAD:fix/player-hitbox-stroke
