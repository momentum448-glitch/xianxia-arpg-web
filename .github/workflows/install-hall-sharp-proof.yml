name: Install sharp Hall proof

on:
  push:
    branches:
      - fix/settlement-hall-sharp-source

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settlement-hall-sharp-source
      - name: Download verified recovered Hall
        env:
          HALL_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-0d5c-81fb-b0aa-059ce9a47376/raw?se=2026-09-19T11%3A54%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=c70dfe20-2032-57aa-b6f7-74366bb0f13f&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T00%3A55%3A47Z&ske=2026-09-20T00%3A55%3A47Z&sks=b&skv=2026-02-06&sig=DMuiWrgIrM0DxLtz%2BPicm6aic8ubQjpfJas8fLn86i0%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/hall.png "$HALL_URL"
          echo "28c7ab193e98121e12a7687eea033f7f384235f066234abd70a70be3d49db30d  /tmp/hall.png" | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path('/tmp/hall.png')
          d = p.read_bytes()
          assert d[:8] == b'\x89PNG\r\n\x1a\n', 'bad PNG signature'
          assert d[12:16] == b'IHDR', 'missing IHDR'
          w,h,depth,ctype,comp,filt,interlace = struct.unpack('>IIBBBBB', d[16:29])
          print('PNG', len(d), w, h, depth, ctype, comp, filt, interlace)
          assert (w,h,depth,ctype,comp,filt,interlace) == (384,268,8,6,0,0,0)
          PY
          cp /tmp/hall.png public/assets/c4/environment/settlement/env_house_hall_a.png
      - name: Commit Hall runtime proof
        run: |
          set -euo pipefail
          git add public/assets/c4/environment/settlement/env_house_hall_a.png
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(art): install sharp recovered Hall runtime asset"
          git push origin HEAD:fix/settlement-hall-sharp-source
