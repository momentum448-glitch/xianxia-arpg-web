name: Tune sword launch clarity
on:
  push:
    branches: [fix/sword-vfx-launch-qc]
permissions:
  contents: write
jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make launch flash easier to read on phone
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scenes/GameScene.ts')
          s = p.read_text()
          pairs = {
            "const launchHalo = this.add.ellipse(this.player.x, this.player.y, 38, 16, launchColor, 0.2)": "const launchHalo = this.add.ellipse(this.player.x, this.player.y, 56, 22, launchColor, 0.32)",
            "const launchCore = this.add.circle(this.player.x, this.player.y, 7, launchColor, 0.62).setDepth(18);": "const launchCore = this.add.circle(this.player.x, this.player.y, 9, launchColor, 0.82).setDepth(18);",
            "this.tweens.add({ targets: launchHalo, scaleX: 2.2, scaleY: 1.5, alpha: 0, duration: 130, onComplete: () => launchHalo.destroy() });": "this.tweens.add({ targets: launchHalo, scaleX: 2.4, scaleY: 1.65, alpha: 0, duration: 180, onComplete: () => launchHalo.destroy() });",
            "this.tweens.add({ targets: launchCore, scale: 1.9, alpha: 0, duration: 105, onComplete: () => launchCore.destroy() });": "this.tweens.add({ targets: launchCore, scale: 2.1, alpha: 0, duration: 145, onComplete: () => launchCore.destroy() });",
          }
          for old, new in pairs.items():
            if old not in s:
              raise SystemExit(f'missing expected launch line: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/tune-sword-launch.yml
      - name: Commit tuning
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scenes/GameScene.ts .github/workflows/tune-sword-launch.yml
          git commit -m "tune(vfx): make sword launch flash readable on phone"
          git push