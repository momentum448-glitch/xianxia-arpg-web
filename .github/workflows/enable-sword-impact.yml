name: Enable sword impact QC
on:
  push:
    branches:
      - fix/sword-impact-qc
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sword-impact-qc
      - name: Enable impact and remove staging workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/scenes/GameScene.ts')
          s=p.read_text()
          old="const SWORD_VFX_QC = { launch: true, trail: true, impact: false } as const;"
          new="const SWORD_VFX_QC = { launch: true, trail: true, impact: true } as const;"
          if old not in s:
              raise SystemExit('expected QC flag not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/enable-sword-impact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scenes/GameScene.ts
          git commit -m "test(vfx): enable flying sword impact QC"
          git push
