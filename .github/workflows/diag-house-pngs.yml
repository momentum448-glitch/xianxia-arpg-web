name: Diagnose settlement house PNGs

on:
  push:
    branches:
      - diag/settlement-house-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Inspect house PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from PIL import Image, ImageFile, ImageFilter, ImageStat

          root = Path('public/assets/c4/environment/settlement')
          for path in sorted(root.glob('env_house_*.png')):
              data = path.read_bytes()
              strict_ok = True
              strict_error = ''
              try:
                  with Image.open(path) as im:
                      im.load()
              except Exception as exc:
                  strict_ok = False
                  strict_error = f'{type(exc).__name__}: {exc}'

              ImageFile.LOAD_TRUNCATED_IMAGES = True
              with Image.open(path) as im:
                  im.load()
                  rgba = im.convert('RGBA')
                  alpha = rgba.getchannel('A').getextrema()
                  edges = rgba.convert('L').filter(ImageFilter.FIND_EDGES)
                  edge_rms = ImageStat.Stat(edges).rms[0]
                  print(
                      f'{path.name} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()} '
                      f'size={im.size} mode={im.mode} bit_depth={data[24]} color_type={data[25]} '
                      f'alpha={alpha} edge_rms={edge_rms:.3f} strict_ok={strict_ok} '
                      f'strict_error={strict_error!r}'
                  )
              ImageFile.LOAD_TRUNCATED_IMAGES = False
          PY
