name: Diagnose settlement house PNGs

on:
  push:
    branches:
      - diag/settlement-house-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover partial Thatch B scanline coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib, hashlib

          data = Path('public/assets/c4/environment/settlement/env_house_thatch_b.png').read_bytes()
          pos = 8
          w = h = depth = ctype = interlace = None
          idat = bytearray()
          while pos + 8 <= len(data):
              n = struct.unpack('>I', data[pos:pos+4])[0]
              typ = data[pos+4:pos+8]
              payload_start = pos + 8
              payload_end = payload_start + n
              if typ == b'IHDR' and payload_end <= len(data):
                  payload = data[payload_start:payload_end]
                  w, h, depth, ctype, comp, filt, interlace = struct.unpack('>IIBBBBB', payload)
              if typ == b'IDAT':
                  available_end = min(payload_end, len(data))
                  idat.extend(data[payload_start:available_end])
                  if payload_end + 4 > len(data):
                      print('IDAT_TRUNCATED declared', n, 'available_payload', len(data) - payload_start,
                            'missing_payload', max(0, payload_end - len(data)))
                      break
              if payload_end + 4 > len(data):
                  break
              pos = payload_end + 4
              if typ == b'IEND':
                  break

          print('IHDR', w, h, depth, ctype, 'interlace', interlace, 'partial_idat_bytes', len(idat))
          d = zlib.decompressobj()
          out = bytearray()
          error = None
          for i in range(0, len(idat), 64):
              try:
                  out.extend(d.decompress(bytes(idat[i:i+64])))
              except Exception as exc:
                  error = (i, type(exc).__name__, str(exc))
                  break
          print('zlib_error', error, 'eof', d.eof)
          print('raw_scanline_bytes_recovered', len(out))
          row_size = w + 1
          expected = row_size * h
          full_rows = len(out) // row_size
          partial_bytes = len(out) % row_size
          print('expected_scanline_bytes', expected)
          print('full_rows_recovered', full_rows, 'of', h, 'partial_next_row_bytes', partial_bytes,
                'coverage', round(len(out)/expected, 6))
          if full_rows:
              filter_counts = {}
              for y in range(full_rows):
                  f = out[y*row_size]
                  filter_counts[f] = filter_counts.get(f, 0) + 1
              print('recovered_filter_types', filter_counts)
          print('file_sha256', hashlib.sha256(data).hexdigest())
          PY
