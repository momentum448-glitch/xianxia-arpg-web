name: C3 Damage Rounding Patch

on:
  push:
    branches: [c3/biome-encounters]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c3/biome-encounters
          fetch-depth: 0
      - name: Tune damage rounding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scenes/GameScene.ts')
          s = p.read_text()
          old = 'Math.max(1, Math.ceil(cfg.damage * enemy.damageMultiplier))'
          if s.count(old) != 3:
              raise SystemExit(f'expected 3 damage expressions, got {s.count(old)}')
          s = s.replace(old, 'Math.max(1, Math.round(cfg.damage * enemy.damageMultiplier))')
          p.write_text(s)
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c3-damage-rounding.yml
          git add src/scenes/GameScene.ts
          git commit -m "balance(c3): smooth biome damage scaling"
          git push origin HEAD:c3/biome-encounters
