name: Build settlement house assets

on:
  push:
    branches:
      - c4/settlement-house-assets
    paths:
      - '.github/workflows/build-settlement-house-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4/settlement-house-assets
          fetch-depth: 0

      - name: Decode production PNGs
        run: |
          set -euo pipefail
          mkdir -p public/assets/c4/environment/settlement
          cat .asset_stage/env_house_hall_a.part1 .asset_stage/env_house_hall_a.part2 | base64 -d > public/assets/c4/environment/settlement/env_house_hall_a.png
          cat .asset_stage/env_house_thatch_b.part1 .asset_stage/env_house_thatch_b.part2 | base64 -d > public/assets/c4/environment/settlement/env_house_thatch_b.png

      - name: Verify PNG structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          expected = {
              'public/assets/c4/environment/settlement/env_house_hall_a.png': (256, 172),
              'public/assets/c4/environment/settlement/env_house_thatch_b.png': (256, 209),
          }
          for name, dims in expected.items():
              data = Path(name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: bad PNG signature'
              assert data[-12:-8] == b'\x00\x00\x00\x00' and data[-8:-4] == b'IEND', f'{name}: missing IEND'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dims, f'{name}: {(width, height)} != {dims}'
              print(name, len(data), width, height)
          PY

      - name: Commit production assets and remove staging
        run: |
          set -euo pipefail
          rm -rf .asset_stage
          rm .github/workflows/build-settlement-house-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(art): add settlement house production assets'
          git push origin HEAD:c4/settlement-house-assets
