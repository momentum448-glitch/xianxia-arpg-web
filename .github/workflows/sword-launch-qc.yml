name: Stage sword launch VFX QC

on:
  push:
    branches:
      - fix/sword-vfx-launch-qc
    paths:
      - '.github/workflows/sword-launch-qc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable launch VFX only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/scenes/GameScene.ts')
          text = path.read_text()

          replacements = [
              (
                  "const SWORD_RAW_QC = true;",
                  "const SWORD_VFX_QC = { launch: true, trail: false, impact: false } as const;",
              ),
              (
                  "    if (!SWORD_RAW_QC) {\n      const launchColor",
                  "    if (SWORD_VFX_QC.launch) {\n      const launchColor",
              ),
              (
                  "      if (!SWORD_RAW_QC && time >= sword.nextTrailAt) {",
                  "      if (SWORD_VFX_QC.trail && time >= sword.nextTrailAt) {",
              ),
              (
                  "          if (!SWORD_RAW_QC) {\n            const impactColor",
                  "          if (SWORD_VFX_QC.impact) {\n            const impactColor",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected block not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit launch-only QC state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sword-launch-qc.yml
          git add src/scenes/GameScene.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(vfx): enable flying sword launch flash only'
          git push
