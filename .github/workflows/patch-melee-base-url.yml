name: Patch melee base URL diagnostic
on:
  push:
    branches: [fix/melee-base-url-fail-loud]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/melee-base-url-fail-loud
      - name: Patch asset URLs and fail-loud melee visual
        shell: python
        run: |
          from pathlib import Path

          game = Path('src/scenes/GameScene.ts')
          s = game.read_text()
          s = s.replace("this.load.image('c4-player-male-idle-s', C4_ASSETS.playerMaleIdleSouth);", "this.load.image('c4-player-male-idle-s', `${import.meta.env.BASE_URL}${C4_ASSETS.playerMaleIdleSouth}`);")
          s = s.replace("this.load.image('c4-enemy-melee-idle-s', C4_ASSETS.enemyMeleeIdleSouth);", "this.load.image('c4-enemy-melee-idle-s', `${import.meta.env.BASE_URL}${C4_ASSETS.enemyMeleeIdleSouth}`);")
          game.write_text(s)

          actor = Path('src/game/actorVisuals.ts')
          s = actor.read_text()
          s = s.replace("scene.load.image(PLAYER_MALE_TEXTURE_KEY, C4_ASSETS.playerMaleIdleSouth);", "scene.load.image(PLAYER_MALE_TEXTURE_KEY, `${import.meta.env.BASE_URL}${C4_ASSETS.playerMaleIdleSouth}`);")
          s = s.replace("scene.load.image(ENEMY_MELEE_TEXTURE_KEY, C4_ASSETS.enemyMeleeIdleSouth);", "scene.load.image(ENEMY_MELEE_TEXTURE_KEY, `${import.meta.env.BASE_URL}${C4_ASSETS.enemyMeleeIdleSouth}`);")
          old = """  const container = scene.add.container(x, y, pieces).setDepth(10);\n  if (kind === 'melee') queueMeleeRuntimeTexture(scene, container, trial);\n  return container;\n}"""
          new = """  const container = scene.add.container(x, y, pieces).setDepth(10);\n  if (kind === 'melee') {\n    if (scene.textures.exists(ENEMY_MELEE_TEXTURE_KEY)) {\n      applyMeleeRuntimeTexture(scene, container, trial);\n    } else {\n      container.removeAll(true);\n      const miss = scene.add.rectangle(0, 0, 86, 86, 0xff00aa, 0.22)\n        .setStrokeStyle(3, 0xff00aa, 0.9);\n      const label = scene.add.text(0, 0, 'MELEE\\nTEX MISS', {\n        fontFamily: 'monospace', fontSize: '12px', color: '#ff00aa', align: 'center',\n      }).setOrigin(0.5);\n      container.add([miss, label]);\n    }\n  }\n  return container;\n}"""
          if old not in s:
              raise SystemExit('target createEnemyVisual tail not found')
          s = s.replace(old, new)
          actor.write_text(s)
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-melee-base-url.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scenes/GameScene.ts src/game/actorVisuals.ts .github/workflows/patch-melee-base-url.yml
          git commit -m "fix(art): resolve C4 asset URLs against Vite base"
          git push
