name: C4 Art Patch

on:
  push:
    branches: [c4/art-identity-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c4/art-identity-foundation
          fetch-depth: 0
      - name: Apply C4 art identity patch
        run: python .github/scripts/apply_c4_art.py
      - name: Commit patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_c4_art.py .github/workflows/c4-art-patch.yml
          git add src/scenes/GameScene.ts
          git commit -m "feat(c4): integrate authored actor silhouettes"
          git push origin HEAD:c4/art-identity-foundation
