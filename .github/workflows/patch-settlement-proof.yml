name: Patch settlement proof

on:
  push:
    branches:
      - c4/settlement-runtime-proof

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4/settlement-runtime-proof
          fetch-depth: 0
      - name: Patch GameScene
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scenes/GameScene.ts')
          text = path.read_text()

          import_anchor = "import { createEnemyVisual, createFlyingSwordVisual, createPlayerVisual } from '../game/actorVisuals';\n"
          env_import = "import { createSettlementEnvironment } from '../game/environmentVisuals';\n"
          if env_import not in text:
              if import_anchor not in text:
                  raise SystemExit('actorVisuals import anchor not found')
              text = text.replace(import_anchor, import_anchor + env_import, 1)

          start_marker = "    const houses = [\n"
          end_marker = "    for (let i = 0; i < 24; i += 1) {\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('settlement placeholder block anchors not found')

          replacement = "    createSettlementEnvironment(this, settlement);\n\n"
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Remove staging workflow
        run: rm .github/workflows/patch-settlement-proof.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/GameScene.ts .github/workflows/patch-settlement-proof.yml
          git commit -m "feat(art): integrate settlement runtime proof"
          git push origin HEAD:c4/settlement-runtime-proof
